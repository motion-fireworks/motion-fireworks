<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>손끝 불꽃놀이</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
let bodyPose;
let video;
let poses = [];
let particles = [];

const MIN_CONF = 0.15;   // 낮을수록 손을 더 빨리 잡아냄
let camW = 640, camH = 480;
let s = 1, offX = 0, offY = 0;

// ===== 위치 보정 =====
const Y_UP = 180;
let debugView = false;

// ===== 배경 =====
const SKY_ALPHA = 1.0;    // 야경 진하기 (0 = 안 보임, 1 = 선명하게)
let sky;                  // 야경 레이어 (처음 한 번만 그림)
let skyBlur;              // 물에 비칠 흐린 야경
let fx;                   // 불꽃 레이어 (매 프레임 그림)
let GROUND;               // 호수 수면 높이
let flash = 0, flashHue = 0;  // 불꽃이 터질 때 하늘이 밝아지는 효과

// ===== 불꽃 설정 =====
const BURST_COUNT = 90;     // 한 번 터질 때 불꽃 알갱이 수
const SPARKLER_COUNT = 2;   // 손목 스파클러: 프레임마다 나오는 불티 수
const MAX_PARTICLES = 1800; // 버벅이지 않게 최대 개수 제한
const FIRE_COLORS = [355, 130, 210, 285, 45];  // 사람별 기본색: 빨강, 초록, 파랑, 보라, 금색

// ===== 소리 설정 =====
const FAST_MODE = false;  // true: 한 사람 전용 초고속 인식 (여러 명 인식은 꺼짐)
let audioCtx = null;
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
const SPEED_MIN = 3;     // 이보다 빠르게 움직이면 펑 (낮출수록 잘 터짐)
const COOLDOWN = 40;     // 다시 터지기까지 최소 간격(ms)
const VOLUME = 0.15;
let prevPts = {};
let lastPop = {};

function preload() {
  ml5.setBackend("webgl");
  bodyPose = ml5.bodyPose("MoveNet", {
    modelType: FAST_MODE ? "SINGLEPOSE_LIGHTNING" : "MULTIPOSE_LIGHTNING",
    enableSmoothing: false
  });
}

function setup() {
  pixelDensity(1);
  createCanvas(windowWidth, windowHeight);
  video = createCapture({ video: { width: 640, height: 480 }, audio: false });
  video.hide();
  colorMode(HSB);
  noCursor();
  makeLayers();
  computeScale();

  console.log("모델 준비 완료!");
  bodyPose.detectStart(video, gotPoses);
}

function draw() {
  updateCamSize();

  // ---- 1) 불꽃 레이어 ----
  fx.blendMode(BLEND);
  fx.background(0, 0, 0, 0.18);   // 잔상(꼬리)
  fx.blendMode(ADD);

  for (let i = 0; i < poses.length; i++) {
    let pose = poses[i];
    let hue = FIRE_COLORS[i % FIRE_COLORS.length];
    handle(pose.left_wrist,  i + "L", hue);
    handle(pose.right_wrist, i + "R", hue);
  }
  updateParticles();

  // ---- 2) 화면에 합치기 ----
  blendMode(BLEND);
  background(0);
  tint(0, 0, 100, SKY_ALPHA);
  image(sky, 0, 0);
  noTint();

  // 불꽃이 터지면 하늘과 건물이 그 색으로 잠깐 밝아짐
  if (flash > 0.01) {
    blendMode(ADD);
    noStroke();
    fill(flashHue, 50, 30, flash * 0.18);
    rect(0, 0, width, GROUND);
    flash *= 0.86;
  }

  drawWater();   // 호수: 도시와 불꽃이 물결에 흔들리며 비침

  if (debugView) {
    blendMode(BLEND);
    push();
    translate(offX + camW * s, offY - Y_UP);
    scale(-s, s);
    tint(0, 0, 100, 0.25);
    image(video, 0, 0, camW, camH);
    pop();
    noTint();
  }

  blendMode(ADD);
  image(fx, 0, 0);
  blendMode(BLEND);
}

// =====================================================
//  불꽃
// =====================================================
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.px = p.x;
    p.py = p.y;
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.vy += p.grav;
    p.x += p.vx * s;
    p.y += p.vy * s;
    p.life -= p.decay;

    if (p.life <= 0) {
      if (p.crackle) crackle(p.x, p.y);   // 다 타고 나서 '타닥' 터지는 잔불꽃
      particles.splice(i, 1);
      continue;
    }

    if (p.kind === "flash") {
      fx.noStroke();
      fx.fill(p.hue, 30, 100, p.life * 0.35);
      fx.circle(p.x, p.y, 50 * s * p.life);
      fx.fill(0, 0, 100, p.life * 0.8);
      fx.circle(p.x, p.y, 10 * s * p.life);
      continue;
    }

    if (p.kind === "spark") {             // 손목의 스파클러 불티
      fx.stroke(45, 25, 100, p.life);
      fx.strokeWeight(1.2 * s);
      fx.line(p.px, p.py, p.x, p.y);
      continue;
    }

    if (p.kind === "ash") {               // 버들 불꽃이 남기는 금빛 꼬리
      fx.noStroke();
      fx.fill(38, 75, 85, p.life * 0.8);
      fx.circle(p.x, p.y, 1.6 * s);
      continue;
    }

    if (p.kind === "crack") {             // 타닥 잔불꽃
      fx.noStroke();
      fx.fill(50, 10, 100, p.life);
      fx.circle(p.x, p.y, random(1, 3.5) * s);
      continue;
    }

    // star: 터진 불꽃 알갱이
    if (p.life < 0.3 && random() < 0.4) continue;     // 꺼지기 직전 깜빡임
    let sat = map(p.life, 1, 0.75, 0, p.sat, true);    // 처음엔 하얗게 뜨겁다가 색이 드러남
    fx.stroke(p.hue, sat, 100, p.life);
    fx.strokeWeight(p.size * s);
    fx.line(p.px, p.py, p.x, p.y);
    fx.noStroke();
    fx.fill(p.hue, sat, 100, 0.12 * p.life);           // 은은한 빛 번짐
    fx.circle(p.x, p.y, p.size * 5 * s);

    if (p.willow && frameCount % 2 === 0 && particles.length < MAX_PARTICLES) {
      particles.push({
        kind: "ash", x: p.x, y: p.y, px: p.x, py: p.y,
        vx: 0, vy: 0.2, drag: 0.98, grav: 0.01,
        life: 1, decay: 0.03
      });
    }
  }
}

function add(p) {
  if (particles.length < MAX_PARTICLES) {
    p.px = p.x;
    p.py = p.y;
    particles.push(p);
  }
}

// 손목에서 계속 튀는 스파클러(불꽃 막대) 불티
function sparkler(x, y) {
  for (let k = 0; k < SPARKLER_COUNT; k++) {
    let a = random(TWO_PI), sp = random(1, 4);
    add({
      kind: "spark", x: x, y: y,
      vx: cos(a) * sp, vy: sin(a) * sp,
      drag: 0.9, grav: 0.1,
      life: 1, decay: random(0.05, 0.09)
    });
  }
}

// 팡! 실제 불꽃놀이처럼 세 가지 모양 중 하나로 터짐
function burst(x, y, hue) {
  flash = 1;
  flashHue = hue;
  add({ kind: "flash", x: x, y: y, vx: 0, vy: 0, drag: 1, grav: 0, life: 1, decay: 0.15, hue: hue });

  let r = random();
  if (r < 0.55) {
    // 국화형(피오니): 구 모양으로 퍼지는 가장 흔한 불꽃 + 가운데 금빛 심
    let maxSp = random(4, 5.5);
    for (let k = 0; k < BURST_COUNT; k++) {
      let a = random(TWO_PI);
      let z = random(-1, 1);                      // 구를 정면에서 본 모양이 되도록
      let sp = maxSp * sqrt(1 - z * z) * random(0.92, 1);
      add({
        kind: "star", x: x, y: y,
        vx: cos(a) * sp, vy: sin(a) * sp,
        drag: 0.955, grav: 0.045,
        life: 1, decay: random(0.010, 0.016),
        hue: (hue + random(-8, 8) + 360) % 360, sat: 85, size: 2
      });
    }
    for (let k = 0; k < 20; k++) {
      let a = random(TWO_PI), sp = random(0.5, 2);
      add({
        kind: "star", x: x, y: y,
        vx: cos(a) * sp, vy: sin(a) * sp,
        drag: 0.95, grav: 0.03,
        life: 1, decay: random(0.02, 0.03),
        hue: 45, sat: 40, size: 1.8
      });
    }
  } else if (r < 0.8) {
    // 버들형(윌로우): 금빛 꼬리를 길게 늘어뜨리며 천천히 떨어짐
    let maxSp = random(3, 3.8);
    for (let k = 0; k < BURST_COUNT * 0.8; k++) {
      let a = random(TWO_PI);
      let z = random(-1, 1);
      let sp = maxSp * sqrt(1 - z * z);
      add({
        kind: "star", x: x, y: y,
        vx: cos(a) * sp, vy: sin(a) * sp,
        drag: 0.97, grav: 0.025,
        life: 1, decay: random(0.005, 0.008),
        hue: 38, sat: 75, size: 1.5, willow: true
      });
    }
  } else {
    // 고리형 + 타닥: 둥근 고리로 퍼지고 끝에서 잔불꽃이 터짐
    let n = floor(BURST_COUNT * 0.6);
    let sp = random(4, 5);
    for (let k = 0; k < n; k++) {
      let a = TWO_PI * k / n;
      add({
        kind: "star", x: x, y: y,
        vx: cos(a) * sp, vy: sin(a) * sp,
        drag: 0.955, grav: 0.035,
        life: 1, decay: random(0.014, 0.018),
        hue: hue, sat: 60, size: 2, crackle: true
      });
    }
  }
}

function crackle(x, y) {
  for (let k = 0; k < 3; k++) {
    add({
      kind: "crack",
      x: x + random(-6, 6) * s, y: y + random(-6, 6) * s,
      vx: 0, vy: 0, drag: 1, grav: 0.02,
      life: 1, decay: random(0.12, 0.2)
    });
  }
}

// =====================================================
//  배경: 상상의 호숫가 도시 야경 (사실적인 표현)
// =====================================================
function makeLayers() {
  if (fx) fx.remove();
  if (sky) sky.remove();

  fx = createGraphics(width, height);
  fx.pixelDensity(1);
  fx.colorMode(HSB);
  fx.strokeCap(ROUND);

  sky = createGraphics(width, height);
  sky.pixelDensity(1);

  GROUND = height * 0.84;
  let W = width, H = GROUND;
  VPX = W * 0.56;          // 소실점: 화면 가운데 살짝 오른쪽
  VPY = GROUND - H * 0.12; // 눈높이: 수면보다 조금 위 → 낮은 건물은 지붕이 보임
  FOCAL = W * 0.8;      // 작을수록 입체감(원근)이 강해짐

  drawSky();
  sky.colorMode(HSB);

  // 먼 빌딩숲 → 안개로 흐리게
  row(H * 0.22, H * 0.42, 0.35, W * 0.025, W * 0.05);
  haze(0.55);

  // 중간 빌딩숲
  row(H * 0.25, H * 0.5, 0.6, W * 0.035, W * 0.065);
  haze(0.25);

  // 상상의 랜드마크
  // (소실점에서 먼 것부터 그림)
  steppedTower(W * 0.12, W * 0.075, H * 0.6);
  needleTower(W * 0.82, W * 0.022, H * 0.76);
  twinTowers(W * 0.27, W * 0.045, H * 0.64, H * 0.55);
  crescentTower(W * 0.68, W * 0.075, H * 0.7);
  spiralTower(W * 0.45, W * 0.085, H * 0.84);

  // 앞쪽 낮은 건물들 (호숫가)
  row(H * 0.1, H * 0.24, 1, W * 0.04, W * 0.08);

  groundGlow();
  drawWaterBase();

  skyBlur = sky.get(0, 0, width, GROUND);   // 물에 비친 모습은 흐릿하게
  skyBlur.filter(BLUR, 3);
}

// 하늘: 맑은 밤하늘의 짙은 청색 → 지평선은 도시 불빛(나트륨등)에 물든 주황빛
//       + 별, 실제 같은 달, 도시 불빛을 아래에서 받은 구름
function drawSky() {
  sky.colorMode(RGB);
  colorMode(RGB);              // color()는 메인 캔버스 색 모드를 따르므로 잠시 RGB로
  sky.noStroke();
  let stops = [
    [0.0,  color(1, 3, 12)],
    [0.45, color(6, 12, 32)],
    [0.75, color(22, 30, 58)],
    [0.92, color(70, 55, 62)],
    [1.0,  color(120, 78, 52)]
  ];
  for (let y = 0; y < GROUND; y++) {
    let t = y / GROUND, c = stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        let a0 = stops[i - 1], a1 = stops[i];
        c = lerpColor(a0[1], a1[1], (t - a0[0]) / (a1[0] - a0[0]));
        break;
      }
    }
    sky.fill(c);
    sky.rect(0, y, width, 1);
  }

  // 별: 대부분 희미하고, 지평선 쪽은 도시 불빛에 묻혀 안 보임
  for (let i = 0; i < 160; i++) {
    let y = pow(random(), 1.6) * GROUND * 0.6;
    let fade = 1 - y / (GROUND * 0.6);
    let b = random() < 0.08 ? random(160, 230) : random(25, 110);
    let warm = random([[255, 255, 255], [255, 240, 220], [220, 230, 255]]);
    sky.fill(warm[0], warm[1], warm[2], b * fade);
    sky.circle(random(width), y, b > 150 ? 1.8 : random(0.6, 1.2));
  }

  colorMode(HSB);
  drawMoon(width * 0.86, GROUND * 0.16, max(16, height * 0.04));
  drawClouds();
}

// 달: 실제 보름달의 앞면 지도를 참고한 배치
//  - 어두운 '바다'(현무암 평원): 왼쪽의 넓은 폭풍의 대양, 위쪽 비의 바다, 오른쪽의 고요의 바다·맑음의 바다,
//    오른쪽 가장자리의 작은 위기의 바다, 아래쪽 구름의 바다 등
//  - 밝은 고지대, 아래쪽 티코 크레이터에서 뻗는 밝은 줄무늬, 코페르니쿠스·아리스타르코스의 밝은 점
const MARIA = [
  // [x, y, 가로반경, 세로반경, 진하기]   (달 반지름 = 1, 오른쪽 +x, 아래쪽 +y)
  [-0.58, -0.02, 0.30, 0.50, 0.9],   // 폭풍의 대양
  [-0.38,  0.20, 0.22, 0.26, 0.8],
  [-0.30, -0.42, 0.30, 0.24, 1.0],   // 비의 바다
  [ 0.20, -0.36, 0.19, 0.18, 1.0],   // 맑음의 바다
  [ 0.32, -0.08, 0.25, 0.22, 1.0],   // 고요의 바다
  [ 0.03, -0.20, 0.13, 0.10, 0.8],   // 증기의 바다
  [ 0.70, -0.28, 0.11, 0.09, 1.0],   // 위기의 바다
  [ 0.52,  0.18, 0.15, 0.23, 0.85],  // 풍요의 바다
  [ 0.33,  0.30, 0.12, 0.11, 0.85],  // 신주의 바다
  [-0.16,  0.36, 0.20, 0.13, 0.75],  // 구름의 바다
  [-0.48,  0.40, 0.10, 0.09, 0.9],   // 습기의 바다
  [-0.08, -0.64, 0.42, 0.07, 0.3],   // 추위의 바다
];
const BRIGHT_SPOTS = [[-0.33, -0.12, 0.035], [-0.62, -0.30, 0.025], [-0.42, -0.05, 0.02]];
const TYCHO = [-0.14, 0.70];

function drawMoon(mx, my, mr) {
  let ctx = sky.drawingContext;
  let g = ctx.createRadialGradient(mx, my, mr * 0.95, mx, my, mr * 8);   // 달빛 번짐
  g.addColorStop(0, "rgba(210,220,240,0.30)");
  g.addColorStop(0.2, "rgba(170,185,220,0.10)");
  g.addColorStop(1, "rgba(120,140,190,0)");
  ctx.fillStyle = g;
  ctx.fillRect(mx - mr * 8, my - mr * 8, mr * 16, mr * 16);

  let SS = 4;                                   // 4배로 크게 그린 뒤 줄여서 매끈하게
  let R = mr * SS, d = ceil(R * 2) + 4;
  let img = createImage(d, d);
  img.loadPixels();
  for (let j = 0; j < d; j++) {
    for (let i = 0; i < d; i++) {
      let nx = (i - d / 2) / R, ny = (j - d / 2) / R;
      let r = sqrt(nx * nx + ny * ny);
      let idx = 4 * (j * d + i);
      if (r > 1.01) { img.pixels[idx + 3] = 0; continue; }

      // 바다: 타원들을 겹치고 노이즈로 가장자리를 불규칙하게
      let wob = (noise(nx * 3 + 50, ny * 3 + 50) - 0.5) * 0.5 + (noise(nx * 9 + 7, ny * 9 + 7) - 0.5) * 0.15;
      let keep = 1;
      for (let m of MARIA) {
        let dx = (nx - m[0]) / m[2], dy = (ny - m[1]) / m[3];
        let dd = sqrt(dx * dx + dy * dy) + wob;
        let t = constrain((dd - 0.8) / 0.25, 0, 1);
        keep *= 1 - (1 - t * t * (3 - 2 * t)) * m[4];   // 부드럽게 겹쳐 하나로 이어지게
      }
      let mare = 1 - keep;
      mare *= 0.85 + 0.3 * noise(nx * 10 + 5, ny * 10 + 5);   // 바다 안의 얼룩

      // 티코에서 뻗는 밝은 줄무늬
      let tx = nx - TYCHO[0], ty = ny - TYCHO[1];
      let td = sqrt(tx * tx + ty * ty);
      let ang = atan2(ty, tx);
      let ray = pow(max(0, noise(ang * 3 + 200) - 0.45) * 2, 2) * max(0, 1 - td / 1.1);
      let rays = ray * 0.35 + (td < 0.05 ? 0.5 : 0) + max(0, 0.12 - td) * 2;

      let spots = 0;
      for (let b of BRIGHT_SPOTS) {
        let bd = dist(nx, ny, b[0], b[1]);
        spots += max(0, 1 - bd / b[2]) * 0.4;
      }

      let tex = (noise(nx * 22 + 9, ny * 22 + 9) - 0.5) * 0.08;  // 고지대 잔 질감
      let nz = sqrt(max(0, 1 - r * r));
      let limb = 0.88 + 0.12 * pow(nz, 0.5);                   // 보름달은 가장자리가 조금만 어두움
      let v = (1.0 - mare * 0.36 + tex + rays * (1 - mare * 0.5) + spots) * limb;
      v = constrain(v, 0, 1.05);
      img.pixels[idx]     = 242 * v - mare * 6;      // 바다는 살짝 푸른 회색
      img.pixels[idx + 1] = 238 * v - mare * 4;
      img.pixels[idx + 2] = 226 * v + mare * 2;
      img.pixels[idx + 3] = 255 * constrain((1.01 - r) * R * 0.5, 0, 1);
    }
  }
  img.updatePixels();
  sky.image(img, mx - mr - 2 / SS, my - mr - 2 / SS, d / SS, d / SS);
}

// 구름: 노이즈로 만든 얇은 층운. 아래쪽은 도시 불빛을 받아 따뜻하게 물듦
function drawClouds() {
  let sc = 2;                                     // 절반 해상도로 계산 → 부드럽고 빠름
  let cw = ceil(width / sc), chh = ceil(GROUND * 0.8 / sc);
  let img = createImage(cw, chh);
  img.loadPixels();
  noiseDetail(5, 0.5);
  let seed = random(1000);
  for (let y = 0; y < chh; y++) {
    let t = y / chh;
    let band = sin(t * PI) * 0.9 + 0.1;           // 하늘 중간 높이에 구름이 많음
    let cr = lerp(28, 120, t * t), cg = lerp(32, 86, t * t), cb = lerp(52, 76, t * t);
    for (let x = 0; x < cw; x++) {
      let n = noise(seed + x * 0.006, y * 0.022);
      let dens = constrain((n - 0.5) / 0.22, 0, 1) * band;
      let idx = 4 * (y * cw + x);
      img.pixels[idx] = cr;
      img.pixels[idx + 1] = cg;
      img.pixels[idx + 2] = cb;
      img.pixels[idx + 3] = dens * 150;
    }
  }
  img.updatePixels();
  noiseDetail(4, 0.5);
  sky.image(img, 0, 0, width, chh * sc);
}

// 먼 건물일수록 지평선 쪽 공기색으로 덮어서 흐리게 (대기원근법)
function haze(a) {
  sky.noStroke();
  let span = GROUND * 0.6;
  for (let y = GROUND - span; y < GROUND; y += 3) {
    let t = (y - (GROUND - span)) / span;
    sky.fill(225, 25, 24, a * t);
    sky.rect(0, y, width, 3);
  }
}

// 지면 근처 가로등·거리 불빛이 은은하게 번지는 효과
function groundGlow() {
  sky.noStroke();
  let span = GROUND * 0.12;
  for (let y = GROUND - span; y < GROUND; y += 2) {
    let t = (y - (GROUND - span)) / span;
    sky.fill(30, 70, 60, 0.12 * t);
    sky.rect(0, y, width, 2);
  }
  for (let x = random(5, 20); x < width; x += random(8, 22)) {   // 호숫가 가로등
    sky.fill(38, 60, 100);
    sky.circle(x, GROUND - 2, 2);
    sky.fill(38, 60, 100, 0.15);
    sky.circle(x, GROUND - 2, 8);
  }
}

// 호수 바탕 (반사는 drawWater에서 매 프레임 그림)
function drawWaterBase() {
  sky.noStroke();
  for (let y = GROUND; y < height; y += 2) {
    let t = (y - GROUND) / (height - GROUND);
    sky.fill(230, 50, lerp(9, 2, t));
    sky.rect(0, y, width, 2);
  }
  sky.stroke(0, 0, 0);
  sky.strokeWeight(2);
  sky.line(0, GROUND, width, GROUND);
}

// ---------- 3D 원근 ----------
// 관객이 호수 건너편에서 도시를 바라보는 시점. 건물 옆면이 소실점(VPX, VPY)을 향해 좁아짐
let VPX, VPY, FOCAL;

function P(x, y, z) {                    // 깊이 z만큼 뒤에 있는 점을 화면 좌표로
  let f = 1 / (1 + z / FOCAL);
  return [VPX + (x - VPX) * f, VPY + (y - VPY) * f];
}

function winSize() { return max(2, width / 320); }

// 창문 불빛 색: 백열등, 형광등, LED, 호박색
const LIGHT_TONES = [[38, 55, 90], [55, 12, 92], [200, 12, 95], [30, 70, 80]];

// 층별 불 켜짐 패턴 (앞면과 옆면이 같은 층 패턴을 공유)
function genFloors(top, bottom) {
  let floorH = winSize() * 1.75, arr = [];
  for (let y = top + floorH * 0.8; y < bottom - floorH * 0.6; y += floorH) {
    let r = random();
    arr.push({ y: y, p: r < 0.06 ? 0.9 : r < 0.5 ? 0.04 : random(0.1, 0.4), tone: random(LIGHT_TONES) });
  }
  return arr;
}

// 직육면체 건물 하나: 옆면 → (낮은 건물이면 지붕 윗면) → 앞면 순서로 그림
function prism(x, top, w, bottom, dim, D, floors) {
  floors = floors || genFloors(top, bottom);
  let edge = null;
  if (x + w < VPX) edge = x + w;          // 소실점 왼쪽 건물 → 오른쪽 옆면이 보임
  else if (x > VPX) edge = x;             // 소실점 오른쪽 건물 → 왼쪽 옆면이 보임
  if (edge !== null) sideFace(edge, top, bottom, D, dim, floors);
  if (top > VPY) topFace(x, top, w, D, dim);
  facade(x, top, w, bottom - top, dim);
  windowsGrid(x, w, dim, () => w, floors);
}

function sideFace(xe, top, bottom, D, dim, floors) {
  let a = P(xe, top, D), b = P(xe, bottom, D);
  sky.noStroke();
  sky.fill(225, 30, 3 + 4 * dim);        // 옆면은 앞면보다 어둡게
  sky.quad(xe, top, a[0], a[1], b[0], b[1], xe, bottom);
  sky.stroke(220, 15, 12 + 10 * dim);     // 모서리 선
  sky.strokeWeight(1);
  sky.line(xe, top, xe, bottom);
  sky.line(xe, top, a[0], a[1]);
  sky.noStroke();
  if (dim < 0.5) return;                  // 먼 건물은 옆면 창문 생략
  let win = winSize(), colW = win * 1.3, m = win * 0.7;
  for (let fl of floors) {
    for (let z = m; z < D - m - win; z += colW) {
      if (random() < fl.p) sky.fill(fl.tone[0], fl.tone[1], fl.tone[2] * 0.6 * dim * random(0.6, 1));
      else sky.fill(220, 35, 6 + 3 * dim);
      let p1 = P(xe, fl.y, z), p2 = P(xe, fl.y, z + win);
      let p3 = P(xe, fl.y + win * 1.1, z + win), p4 = P(xe, fl.y + win * 1.1, z);
      sky.quad(p1[0], p1[1], p2[0], p2[1], p3[0], p3[1], p4[0], p4[1]);
    }
  }
}

function topFace(x, top, w, D, dim) {
  let a = P(x, top, D), b = P(x + w, top, D);
  sky.noStroke();
  sky.fill(225, 25, 8 + 6 * dim);
  sky.quad(x, top, x + w, top, b[0], b[1], a[0], a[1]);
}

// 앞면: 한쪽이 살짝 밝은 외벽 + 위 모서리 하이라이트
function facade(x, top, w, h, dim) {
  sky.noStroke();
  let base = 5 + 6 * dim;
  for (let i = 0; i < w; i += 2) {
    sky.fill(225, 30, base * (0.7 + 0.6 * (i / w)));
    sky.rect(x + i, top, min(2, w - i), h);
  }
  sky.fill(220, 10, 15 + 12 * dim);
  sky.rect(x, top, w, 1);
}

// 앞면 창문 격자. widthAt(y)는 그 높이에서 건물 폭 (곡면 건물용)
function windowsGrid(x, w, dim, widthAt, floors) {
  let win = winSize(), colW = win * 1.3, m = win * 0.7;
  sky.noStroke();
  for (let fl of floors) {
    let ww = widthAt(fl.y);
    for (let xx = x + m; xx < x + ww - m - win; xx += colW) {
      if (random() < fl.p) {
        sky.fill(fl.tone[0], fl.tone[1], fl.tone[2] * (0.2 + 0.7 * dim) * random(0.6, 1));
      } else {
        sky.fill(220, 35, 9 + 5 * dim);   // 꺼진 창: 어두운 유리
      }
      sky.rect(xx, fl.y, win, win * 1.1);
    }
  }
}

// 한 줄로 늘어선 빌딩들 (바깥쪽부터 그려야 가운데 건물이 옆면을 자연스럽게 가림)
function row(minH, maxH, dim, minW, maxW) {
  let list = [];
  let x = -random(minW);
  while (x < width) {
    let w = random(minW, maxW);
    list.push({ x: x, w: w, h: random(minH, maxH) });
    x += w + random(w * 0.05, w * 0.4);
  }
  list.sort((a, b) => abs(b.x + b.w / 2 - VPX) - abs(a.x + a.w / 2 - VPX));
  for (let t of list) tower(t.x, t.w, t.h, dim);
}

function tower(x, w, h, dim) {
  prism(x, GROUND - h, w, GROUND, dim, w * 1.2);
  roof(x, GROUND - h, w, dim);
}

// 옥상 설비: 안테나 + 빨간 경고등, 기계실, 조명 띠
function roof(x, top, w, dim) {
  let r = random();
  sky.noStroke();
  if (r < 0.3) {
    let ah = random(10, 30) * (0.5 + dim * 0.5);
    sky.stroke(220, 10, 25 + 20 * dim);
    sky.strokeWeight(1.5);
    sky.line(x + w * 0.5, top, x + w * 0.5, top - ah);
    sky.noStroke();
    sky.fill(0, 90, 60 + 40 * dim);
    sky.circle(x + w * 0.5, top - ah, 3);
  } else if (r < 0.55) {
    sky.fill(225, 30, 6 + 5 * dim);
    sky.rect(x + w * 0.2, top - w * 0.12, w * 0.5, w * 0.12);
  } else if (r < 0.65) {
    sky.fill(45, 20, 60 + 35 * dim);
    sky.rect(x, top, w, 2);
  }
}

// ---- 계단식 타워: 위로 갈수록 몇 단씩 좁아짐 + 꼭대기 조명 ----
function steppedTower(cx, w, h) {
  let steps = [[1.0, 0.7], [0.78, 0.86], [0.56, 0.96], [0.3, 1.0]];
  for (let st of steps) {
    let sw = w * st[0];
    prism(cx - sw / 2, GROUND - h * st[1], sw, GROUND, 1, sw * 0.9);
  }
  let top = GROUND - h;
  sky.noStroke();
  sky.fill(45, 25, 100, 0.25);
  sky.ellipse(cx, top, w * 0.6, w * 0.2);
  sky.stroke(220, 10, 45);
  sky.strokeWeight(2);
  sky.line(cx, top, cx, top - h * 0.08);
}

// ---- 하늘다리로 이어진 쌍둥이 타워 ----
function twinTowers(cx, w, h1, h2) {
  let x1 = cx - w * 1.5, x2 = cx + w * 0.5;
  let by = GROUND - min(h1, h2) * 0.7, bh = w * 0.35;
  prism(x1, GROUND - h1, w, GROUND, 1, w * 0.9);
  prism(x1 + w, by, x2 - x1 - w, by + bh, 1, w * 0.6, []);
  sky.noStroke();
  for (let xx = x1 + w + 3; xx < x2 - 4; xx += 5) {
    sky.fill(55, 12, random() < 0.7 ? 90 : 20);
    sky.rect(xx, by + bh * 0.35, 3, bh * 0.35);
  }
  prism(x2, GROUND - h2, w, GROUND, 1, w * 0.9);
}

// ---- 나선 타워: 층마다 비틀려 올라가는 유리 타워 (층 하나하나가 입체) ----
function spiralTower(cx, w, h) {
  let n = 46, fh = h / n;
  let off = 0, x0 = cx - w / 2;
  for (let i = 0; i < n; i++) {
    let t = i / n;
    off = sin(t * TWO_PI * 1.2) * w * 0.15;
    let fw = w * (1 - t * 0.35);
    x0 = cx - fw / 2 + off;
    let fy = GROUND - (i + 1) * fh;
    let r = random();
    let floor1 = [{ y: fy + fh * 0.25, p: r < 0.08 ? 0.9 : r < 0.45 ? 0.04 : random(0.15, 0.45), tone: random(LIGHT_TONES) }];
    prism(x0, fy, fw, fy + fh, 1, fw * 0.9, floor1);
    sky.noStroke();
    sky.fill(220, 10, 28);                       // 층 슬래브 가장자리
    sky.rect(x0, fy + fh - 1, fw, 1);
  }
  let top = GROUND - h, tx = cx + off;
  sky.stroke(220, 10, 45);
  sky.strokeWeight(2);
  sky.line(tx, top, tx, top - h * 0.1);
  sky.noStroke();
  sky.fill(0, 90, 100);
  sky.circle(tx, top - h * 0.1, 4);
}

// ---- 곡면 타워: 한쪽 면이 부드럽게 휘어진 유리 빌딩 ----
function crescentTower(cx, w, h) {
  let x0 = cx - w / 2, top = GROUND - h;
  let edgeW = (y) => w * min(1, 0.25 + ((y - top) / h) * 1.5);
  let floors = genFloors(top, GROUND);
  if (x0 > VPX) sideFace(x0, top, GROUND, w * 0.9, 1, floors);   // 곧은 쪽 옆면
  for (let y = top; y < GROUND; y += 2) facade(x0, y, edgeW(y), 2, 1);
  windowsGrid(x0, w, 1, edgeW, floors);
  sky.noFill();
  sky.stroke(215, 15, 40);                        // 곡면 유리에 비친 하이라이트
  sky.strokeWeight(1.5);
  sky.beginShape();
  for (let y = top; y < GROUND; y += 4) sky.vertex(x0 + edgeW(y), y);
  sky.endShape();
}

// ---- 전망대 타워: 가는 기둥 + 원반형 전망대 + 안테나 ----
function needleTower(cx, w, h) {
  let top = GROUND - h;
  for (let i = 0; i < 10; i++) {
    let t = i / 10;
    facade(cx - w / 2 * (1 - t * 0.3), GROUND - h * (t + 0.1), w * (1 - t * 0.3), h * 0.1, 1);
  }
  let py = top + h * 0.12, pw = w * 4.5, ph = w * 1.4;
  sky.noStroke();
  sky.fill(225, 30, 10);
  sky.ellipse(cx, py, pw, ph);
  sky.fill(225, 30, 6);
  sky.rect(cx - pw * 0.35, py, pw * 0.7, ph * 0.5, 0, 0, ph * 0.3, ph * 0.3);
  for (let a = 0.15; a < PI - 0.1; a += 0.12) {   // 전망대 창 띠
    sky.fill(40, 40, random() < 0.8 ? 95 : 30);
    sky.rect(cx + cos(a) * pw * 0.45 - 1, py + ph * 0.05, 2.5, ph * 0.18);
  }
  sky.stroke(220, 10, 45);
  sky.strokeWeight(1.5);
  sky.line(cx, top, cx, top - h * 0.14);
  sky.noStroke();
  sky.fill(0, 90, 100);
  sky.circle(cx, top - h * 0.14, 4);
}

// =====================================================
//  호수: 띠 단위로 잘라 물결처럼 흔들며 뒤집어 비춤
// =====================================================
function drawWater() {
  let r = height - GROUND;
  let t = frameCount * 0.05;
  let sh = 3;
  for (let k = 0; k < r; k += sh) {
    let depth = k / r;
    let off = sin(k * 0.35 + t) * (1 + depth * 6) + sin(k * 0.11 - t * 0.7) * depth * 4;
    let srcY = GROUND - k * 0.6 - sh;      // 0.6: 반사가 세로로 길게 늘어나 보이게
    if (srcY < 0) break;

    blendMode(BLEND);                       // 도시 반사
    tint(0, 0, 100, 0.6 * (1 - depth * 0.5));
    image(skyBlur, off * 1.5, GROUND + k, width, sh, 0, srcY, width, sh);

    blendMode(ADD);                         // 불꽃 반사
    tint(0, 0, 100, 0.65 * (1 - depth * 0.4));
    image(fx, off * 1.5, GROUND + k, width, sh, 0, srcY, width, sh);
  }
  noTint();
  blendMode(BLEND);
}

// =====================================================

function updateCamSize() {
  let vw = video.elt.videoWidth;
  let vh = video.elt.videoHeight;
  if (vw > 0 && vh > 0 && (vw !== camW || vh !== camH)) {
    camW = vw;
    camH = vh;
    computeScale();
    console.log("카메라 크기: " + camW + " x " + camH);
  }
}

function handle(point, key, hue) {
  if (!point || point.confidence < MIN_CONF) {
    delete prevPts[key];
    return;
  }

  let x = offX + (camW - point.x) * s;
  let y = offY + point.y * s - Y_UP;

  sparkler(x, y);

  let prev = prevPts[key];
  if (prev) {
    let speed = dist(point.x, point.y, prev.x, prev.y);
    let now = millis();
    if (speed > SPEED_MIN && now - (lastPop[key] || 0) > COOLDOWN) {
      lastPop[key] = now;
      burst(x, y, hue);

      let idx = floor(map(point.y, camH, 0, 0, SCALE.length));
      idx = constrain(idx, 0, SCALE.length - 1);
      playChime(SCALE[idx]);
    }
  }
  prevPts[key] = { x: point.x, y: point.y };
}

function playChime(freq) {
  if (!audioCtx) return;
  let t = audioCtx.currentTime;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(VOLUME, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.8);
}

function computeScale() {
  s = max(width / camW, height / camH);
  offX = (width - camW * s) / 2;
  offY = (height - camH * s) / 2;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeLayers();
  computeScale();
}

function keyPressed() {
  if (key === "d" || key === "D") debugView = !debugView;
}

function mousePressed() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();

  let el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }
}

function gotPoses(results) {
  poses = results;
}
