<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>손끝 불꽃놀이</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
let bodyPose;
let video;
let poses = [];
let particles = [];

const MIN_CONF = 0.2;
let camW = 640, camH = 480;
let s = 1, offX = 0, offY = 0;

// ===== 위치 보정 =====
const Y_UP = 180;
let debugView = false;

// ===== 배경 야경 =====
const SKY_ALPHA = 0.85;   // 야경 진하기 (0 = 안 보임, 1 = 선명하게)
let sky;                  // 야경 레이어
let fx;                   // 불꽃 레이어

// ===== 불꽃 설정 =====
const BURST_COUNT = 30;
const EMBER_EVERY = 2;
const MAX_PARTICLES = 800;

// ===== 소리 설정 =====
let audioCtx = null;
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
const SPEED_MIN = 5;
const COOLDOWN = 70;
const VOLUME = 0.15;
let prevPts = {};
let lastPop = {};

function preload() {
  ml5.setBackend("webgl");
  bodyPose = ml5.bodyPose("MoveNet", { enableSmoothing: false });
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  video = createCapture({ video: { width: 640, height: 480 }, audio: false });
  video.hide();
  colorMode(HSB);
  noCursor();
  makeLayers();
  computeScale();

  console.log("모델 준비 완료!");
  bodyPose.detectStart(video, gotPoses);
}

function draw() {
  updateCamSize();

  // ---- 1) 불꽃 레이어: 잔상 효과는 여기서만 ----
  fx.blendMode(BLEND);
  fx.background(0, 0, 0, 0.12);
  fx.blendMode(ADD);

  for (let i = 0; i < poses.length; i++) {
    let pose = poses[i];
    let baseHue = (i * 120) % 360;
    handle(pose.left_wrist,  i + "L", baseHue);
    handle(pose.right_wrist, i + "R", baseHue);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.px = p.x;
    p.py = p.y;
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.vy += p.grav;
    p.x += p.vx * s;
    p.y += p.vy * s;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    if (p.kind === "flash") {
      fx.noStroke();
      fx.fill(p.hue, 20, 100, p.life);
      fx.circle(p.x, p.y, 60 * s * p.life);
      continue;
    }

    if (p.life < 0.4 && random() < 0.35) continue;

    let sat = map(p.life, 1, 0.5, 5, 85, true);
    fx.stroke(p.hue, sat, 100, p.life);
    fx.strokeWeight((p.kind === "spark" ? 2.5 : 2) * s);
    fx.line(p.px, p.py, p.x, p.y);
  }

  // ---- 2) 화면에 합치기: 야경 → (확인모드 영상) → 불꽃 ----
  blendMode(BLEND);
  background(0);
  tint(0, 0, 100, SKY_ALPHA);
  image(sky, 0, 0);
  noTint();

  if (debugView) {
    push();
    translate(offX + camW * s, offY - Y_UP);
    scale(-s, s);
    tint(0, 0, 100, 0.25);
    image(video, 0, 0, camW, camH);
    pop();
    noTint();
  }

  blendMode(ADD);
  image(fx, 0, 0);
}

// =====================================================
//  배경: 상상의 도시 야경 (호숫가 도시 + 물 위 반사)
// =====================================================
let GROUND;   // 땅(수면) 높이

function makeLayers() {
  if (fx) fx.remove();
  if (sky) sky.remove();

  fx = createGraphics(width, height);
  fx.colorMode(HSB);
  fx.strokeCap(ROUND);

  sky = createGraphics(width, height);
  sky.colorMode(HSB);

  GROUND = height * 0.86;

  // 하늘: 위는 짙은 남색, 지평선 쪽은 도시 불빛에 물든 보랏빛
  sky.noStroke();
  for (let y = 0; y < height; y += 2) {
    let t = y / GROUND;
    sky.fill(lerp(232, 285, t), lerp(75, 55, t), lerp(5, 32, t));
    sky.rect(0, y, width, 2);
  }

  let W = width, H = GROUND;

  // 뒷줄: 멀리 있는 낮은 빌딩들
  backRow(H * 0.36);

  // 중간줄: 랜드마크 사이를 채우는 빌딩들
  for (let p of [0.04, 0.22, 0.39, 0.56, 0.72, 0.87, 0.97]) {
    let w = W * random(0.05, 0.08);
    rectBuilding(W * p - w / 2, w, H * random(0.25, 0.42), 0.8, 0.3);
  }

  // 상상의 랜드마크 (왼쪽 → 오른쪽)
  stackedBlocks(W * 0.13, W * 0.08, H * 0.52);   // 엇갈려 쌓인 상자 빌딩
  twinTowers(W * 0.30, W * 0.045, H * 0.6, H * 0.5); // 하늘다리로 이어진 쌍둥이
  spiralTower(W * 0.47, W * 0.09, H * 0.82);      // 층마다 비틀린 나선 타워
  crescent(W * 0.63, W * 0.08, H * 0.66);         // 초승달 곡면 타워
  haloNeedle(W * 0.79, W * 0.035, H * 0.72);      // 빛의 고리를 두른 바늘 탑
  dome(W * 0.92, W * 0.10, H * 0.2);              // 반구 전망대

  // 수면 반사
  reflection();
}

// 건물 몸체 색 (dim이 클수록 가까워서 살짝 밝음)
function bodyColor(dim) {
  sky.fill(230, 35, 8 + 8 * dim);
  sky.stroke(230, 25, 22 + 10 * dim);   // 윤곽선을 살짝 밝게 → 하늘과 구분
  sky.strokeWeight(1);
}

// 창문 불빛: 대부분 따뜻한 노란빛, 일부는 차가운 흰빛
function windowLight(dim) {
  sky.noStroke();
  if (random() < 0.3) sky.fill(200, 15, 40 + 55 * dim);
  else sky.fill(random(32, 50), random(40, 70), 30 + 65 * dim);
}

// 직사각형 빌딩 + 창문
function rectBuilding(x, w, h, dim, prob) {
  let top = GROUND - h;
  bodyColor(dim);
  sky.rect(x, top, w, h);
  litWindows(x, top, w, h, dim, prob);
  return top;
}

function litWindows(x, top, w, h, dim, prob) {
  let win = max(4, width / 160);
  let gap = win * 0.7;
  for (let wy = top + gap * 1.5; wy < top + h - win; wy += win + gap) {
    for (let wx = x + gap; wx < x + w - win * 0.7; wx += win * 0.7 + gap) {
      if (random() < prob) {
        windowLight(dim);
        sky.rect(wx, wy, win * 0.7, win);
      }
    }
  }
}

function backRow(maxH) {
  let x = 0;
  while (x < width) {
    let w = random(width * 0.03, width * 0.07);
    rectBuilding(x, w, random(maxH * 0.4, maxH), 0.45, 0.22);
    x += w + random(0, width * 0.005);
  }
}

// ---- 엇갈려 쌓인 상자 빌딩: 블록을 지그재그로 쌓은 모양 ----
function stackedBlocks(cx, w, h) {
  let n = 5, bh = h / n;
  for (let i = 0; i < n; i++) {
    let bw = w * random(0.8, 1.25);
    let bx = cx - bw / 2 + (i % 2 === 0 ? -1 : 1) * w * random(0.1, 0.25);
    let by = GROUND - (i + 1) * bh;
    bodyColor(1);
    sky.rect(bx, by, bw, bh);
    litWindows(bx, by, bw, bh, 1, 0.4);
    sky.noStroke();
    sky.fill(320, 40, 85);                         // 블록마다 분홍빛 띠
    sky.rect(bx, by + bh - 2, bw, 2);
  }
}

// ---- 하늘다리로 이어진 쌍둥이 타워 ----
function twinTowers(cx, w, h1, h2) {
  let x1 = cx - w * 1.5, x2 = cx + w * 0.5;
  rectBuilding(x1, w, h1, 1, 0.35);
  rectBuilding(x2, w, h2, 1, 0.35);
  let by = GROUND - min(h1, h2) * 0.72;
  bodyColor(1);
  sky.rect(x1 + w, by, x2 - x1 - w, w * 0.4);
  sky.noStroke();
  sky.fill(190, 45, 95);                           // 다리의 푸른 조명
  sky.rect(x1 + w, by + w * 0.15, x2 - x1 - w, w * 0.1);
}

// ---- 나선 타워: 층마다 조금씩 옆으로 비틀리며 올라감 ----
function spiralTower(cx, w, h) {
  let n = 24, fh = h / n;
  let top = GROUND - h;
  for (let i = 0; i < n; i++) {
    let t = i / n;
    let off = sin(t * TWO_PI * 1.5) * w * 0.18;
    let fw = w * (1 - t * 0.35);
    let fx0 = cx - fw / 2 + off;
    let fy = GROUND - (i + 1) * fh;
    bodyColor(1);
    sky.rect(fx0, fy, fw, fh * 0.9);
    if (random() < 0.6) {                          // 층별 창문 띠
      windowLight(1);
      let len = fw * random(0.3, 0.8);
      sky.rect(fx0 + random(0, fw - len), fy + fh * 0.3, len, fh * 0.3);
    }
    sky.noStroke();
    sky.fill(175, 60, 100);                        // 층 끝 조명 → 나선이 빛으로 보임
    sky.circle(fx0 + fw, fy + fh * 0.45, max(3, fh * 0.35));
  }
  sky.stroke(230, 10, 55);
  sky.strokeWeight(2);
  sky.line(cx, top, cx, top - h * 0.1);
  sky.noStroke();
  sky.fill(175, 60, 100);
  sky.circle(cx, top - h * 0.1, max(5, w * 0.06));
}

// ---- 초승달 타워: 한쪽 면이 크게 휘어진 곡면 빌딩 ----
function crescent(cx, w, h) {
  let x0 = cx - w / 2, top = GROUND - h;
  bodyColor(1);
  sky.beginShape();
  sky.vertex(x0, GROUND);
  sky.vertex(x0, top);
  sky.bezierVertex(x0 + w * 1.3, top + h * 0.15, x0 + w * 1.2, top + h * 0.7, x0 + w, GROUND);
  sky.endShape(CLOSE);

  // 창문: 곡면 안쪽에만
  let win = max(4, width / 160), gap = win * 0.7;
  for (let wy = top + win * 2; wy < GROUND - win; wy += win + gap) {
    let f = (wy - top) / h;
    let edge = x0 + w * min(0.95, 0.2 + f * 1.4);
    for (let wx = x0 + gap; wx < edge - win; wx += win * 0.7 + gap) {
      if (random() < 0.35) {
        windowLight(1);
        sky.rect(wx, wy, win * 0.7, win);
      }
    }
  }

  // 곡면 가장자리를 따라 흐르는 빛
  sky.noFill();
  sky.stroke(280, 50, 100);
  sky.strokeWeight(2);
  sky.bezier(x0, top, x0 + w * 1.3, top + h * 0.15, x0 + w * 1.2, top + h * 0.7, x0 + w, GROUND);
}

// ---- 빛의 고리를 두른 바늘 탑 ----
function haloNeedle(cx, w, h) {
  let top = GROUND - h;
  bodyColor(1);
  sky.quad(cx - w / 2, GROUND, cx + w / 2, GROUND, cx + w * 0.2, top, cx - w * 0.2, top);
  litWindows(cx - w * 0.3, top + h * 0.2, w * 0.6, h * 0.8, 1, 0.3);

  let ry = top + h * 0.15;
  sky.noStroke();
  sky.fill(160, 50, 100, 0.15);                    // 고리 주변 번짐
  sky.ellipse(cx, ry, w * 5, w * 1.6);
  sky.noFill();
  sky.stroke(160, 50, 100);
  sky.strokeWeight(3);
  sky.ellipse(cx, ry, w * 4, w * 1.0);

  sky.stroke(230, 10, 55);
  sky.strokeWeight(2);
  sky.line(cx, top, cx, top - h * 0.12);
  sky.noStroke();
  sky.fill(0, 90, 100);
  sky.circle(cx, top - h * 0.12, max(4, w * 0.15));
}

// ---- 반구 전망대: 격자 유리 돔 ----
function dome(cx, w, h) {
  let baseH = h * 0.4;
  rectBuilding(cx - w * 0.45, w * 0.9, baseH, 1, 0.3);
  let dy = GROUND - baseH;
  bodyColor(1);
  sky.arc(cx, dy, w, h * 1.2, PI, TWO_PI, CHORD);
  sky.noStroke();
  for (let a = PI + 0.15; a < TWO_PI - 0.1; a += 0.22) {   // 돔 격자 불빛
    for (let r = 0.25; r <= 0.95; r += 0.23) {
      if (random() < 0.6) {
        windowLight(1);
        sky.circle(cx + cos(a) * w / 2 * r, dy + sin(a) * h * 0.6 * r, max(2, w * 0.025));
      }
    }
  }
}

// ---- 수면 반사: 도시를 뒤집어 희미하게 비추고 물결로 흐트러뜨림 ----
function reflection() {
  let r = height - GROUND;
  let img = sky.get(0, GROUND - r, width, r);

  sky.noStroke();
  sky.fill(235, 60, 5);
  sky.rect(0, GROUND, width, r);

  sky.push();
  sky.scale(1, -1);
  sky.tint(0, 0, 100, 0.35);
  sky.image(img, 0, -(GROUND + r), width, r);
  sky.pop();
  sky.noTint();

  // 물결
  for (let y = GROUND + 2; y < height; y += random(3, 7)) {
    sky.stroke(235, 50, 6, 0.7);
    sky.strokeWeight(random(1, 2));
    let x = random(-width * 0.2, width);
    sky.line(x, y, x + random(width * 0.1, width * 0.5), y);
  }

  // 수평선
  sky.stroke(270, 30, 45);
  sky.strokeWeight(1);
  sky.line(0, GROUND, width, GROUND);
}

// =====================================================

function updateCamSize() {
  let vw = video.elt.videoWidth;
  let vh = video.elt.videoHeight;
  if (vw > 0 && vh > 0 && (vw !== camW || vh !== camH)) {
    camW = vw;
    camH = vh;
    computeScale();
    console.log("카메라 크기: " + camW + " x " + camH);
  }
}

function handle(point, key, baseHue) {
  if (!point || point.confidence < MIN_CONF) {
    delete prevPts[key];
    return;
  }

  let x = offX + (camW - point.x) * s;
  let y = offY + point.y * s - Y_UP;

  if (frameCount % EMBER_EVERY === 0) ember(x, y, baseHue);

  let prev = prevPts[key];
  if (prev) {
    let speed = dist(point.x, point.y, prev.x, prev.y);
    let now = millis();
    if (speed > SPEED_MIN && now - (lastPop[key] || 0) > COOLDOWN) {
      lastPop[key] = now;
      burst(x, y, baseHue);

      let idx = floor(map(point.y, camH, 0, 0, SCALE.length));
      idx = constrain(idx, 0, SCALE.length - 1);
      playChime(SCALE[idx]);
    }
  }
  prevPts[key] = { x: point.x, y: point.y };
}

function ember(x, y, baseHue) {
  if (particles.length > MAX_PARTICLES) return;
  particles.push({
    kind: "ember",
    x: x, y: y, px: x, py: y,
    vx: random(-0.5, 0.5),
    vy: random(-1.5, -0.3),
    drag: 0.99,
    grav: -0.005,
    life: 1,
    decay: 0.015,
    hue: (baseHue + random(-20, 20) + 360) % 360
  });
}

function burst(x, y, baseHue) {
  particles.push({
    kind: "flash",
    x: x, y: y, px: x, py: y,
    vx: 0, vy: 0, drag: 1, grav: 0,
    life: 1, decay: 0.12,
    hue: baseHue
  });

  for (let k = 0; k < BURST_COUNT; k++) {
    if (particles.length > MAX_PARTICLES) return;
    let angle = TWO_PI * k / BURST_COUNT + random(-0.1, 0.1);
    let speed = random(2.5, 4.5);
    particles.push({
      kind: "spark",
      x: x, y: y, px: x, py: y,
      vx: cos(angle) * speed,
      vy: sin(angle) * speed,
      drag: 0.95,
      grav: 0.04,
      life: 1,
      decay: random(0.012, 0.02),
      hue: (baseHue + random(-15, 15) + 360) % 360
    });
  }
}

function playChime(freq) {
  if (!audioCtx) return;
  let t = audioCtx.currentTime;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(VOLUME, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.8);
}

function computeScale() {
  s = max(width / camW, height / camH);
  offX = (width - camW * s) / 2;
  offY = (height - camH * s) / 2;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeLayers();
  computeScale();
}

function keyPressed() {
  if (key === "d" || key === "D") debugView = !debugView;
}

function mousePressed() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();

  let el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }
}

function gotPoses(results) {
  poses = results;
}
</script>
</body>
</html>
