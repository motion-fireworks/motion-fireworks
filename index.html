<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>손끝 불꽃놀이</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
let bodyPose;
let video;
let poses = [];
let particles = [];

const MIN_CONF = 0.15;   // 낮을수록 손을 더 빨리 잡아냄
let camW = 640, camH = 480;
let s = 1, offX = 0, offY = 0;

// ===== 위치 보정 =====
const Y_UP = 180;
let debugView = false;

// ===== 배경 =====
const SKY_ALPHA = 1.0;    // 야경 진하기 (0 = 안 보임, 1 = 선명하게)
let sky;                  // 야경 레이어 (처음 한 번만 그림)
let skyBlur;              // 물에 비칠 흐린 야경
let fx;                   // 불꽃 레이어 (매 프레임 그림)
let GROUND;               // 호수 수면 높이
let flash = 0, flashHue = 0;  // 불꽃이 터질 때 하늘이 밝아지는 효과
let moonImg;              // 달 사진 (moon.png)

// ===== 불꽃 설정 =====
const BURST_COUNT = 90;     // 한 번 터질 때 불꽃 알갱이 수
const SPARKLER_COUNT = 2;   // 손목 스파클러: 프레임마다 나오는 불티 수
const MAX_PARTICLES = 1800; // 버벅이지 않게 최대 개수 제한
const FIRE_COLORS = [355, 130, 210, 285, 45];  // 사람별 기본색: 빨강, 초록, 파랑, 보라, 금색

// ===== 소리 설정 =====
const FAST_MODE = false;  // true: 한 사람 전용 초고속 인식 (여러 명 인식은 꺼짐)
let audioCtx = null;
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
const SPEED_MIN = 3;     // 이보다 빠르게 움직이면 펑 (낮출수록 잘 터짐)
const COOLDOWN = 40;     // 다시 터지기까지 최소 간격(ms)
const VOLUME = 0.15;
let prevPts = {};
let lastPop = {};

function preload() {
  moonImg = loadImage("moon.png");
  ml5.setBackend("webgl");
  bodyPose = ml5.bodyPose("MoveNet", {
    modelType: FAST_MODE ? "SINGLEPOSE_LIGHTNING" : "MULTIPOSE_LIGHTNING",
    enableSmoothing: false
  });
}

function setup() {
  pixelDensity(1);
  createCanvas(windowWidth, windowHeight);
  video = createCapture({ video: { width: 640, height: 480 }, audio: false });
  video.hide();
  colorMode(HSB);
  noCursor();
  makeLayers();
  computeScale();

  console.log("모델 준비 완료!");
  bodyPose.detectStart(video, gotPoses);
}

function draw() {
  updateCamSize();

  // ---- 1) 불꽃 레이어 ----
  fx.blendMode(BLEND);
  fx.background(0, 0, 0, 0.18);   // 잔상(꼬리)
  fx.blendMode(ADD);

  for (let i = 0; i < poses.length; i++) {
    let pose = poses[i];
    let hue = FIRE_COLORS[i % FIRE_COLORS.length];
    handle(pose.left_wrist,  i + "L", hue);
    handle(pose.right_wrist, i + "R", hue);
  }
  updateParticles();

  // ---- 2) 화면에 합치기 ----
  blendMode(BLEND);
  background(0);
  tint(0, 0, 100, SKY_ALPHA);
  image(sky, 0, 0);
  noTint();

  // 불꽃이 터지면 하늘과 건물이 그 색으로 잠깐 밝아짐
  if (flash > 0.01) {
    blendMode(ADD);
    noStroke();
    fill(flashHue, 50, 30, flash * 0.18);
    rect(0, 0, width, GROUND);
    flash *= 0.86;
  }

  drawWater();   // 호수: 도시와 불꽃이 물결에 흔들리며 비침

  if (debugView) {
    blendMode(BLEND);
    push();
    translate(offX + camW * s, offY - Y_UP);
    scale(-s, s);
    tint(0, 0, 100, 0.25);
    image(video, 0, 0, camW, camH);
    pop();
    noTint();
  }

  blendMode(ADD);
  image(fx, 0, 0);
  blendMode(BLEND);
}

// =====================================================
//  불꽃
// =====================================================
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.px = p.x;
    p.py = p.y;
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.vy += p.grav;
    p.x += p.vx * s;
    p.y += p.vy * s;
    p.life -= p.decay;

    if (p.life <= 0) {
      if (p.crackle) crackle(p.x, p.y);   // 다 타고 나서 '타닥' 터지는 잔불꽃
      particles.splice(i, 1);
      continue;
    }

    if (p.kind === "flash") {
      fx.noStroke();
      fx.fill(p.hue, 30, 100, p.life * 0.35);
      fx.circle(p.x, p.y, 50 * s * p.life);
      fx.fill(0, 0, 100, p.life * 0.8);
      fx.circle(p.x, p.y, 10 * s * p.life);
      continue;
    }

    if (p.kind === "spark") {             // 손목의 스파클러 불티
      fx.stroke(45, 25, 100, p.life);
      fx.strokeWeight(1.2 * s);
      fx.line(p.px, p.py, p.x, p.y);
      continue;
    }

    if (p.kind === "ash") {               // 버들 불꽃이 남기는 금빛 꼬리
      fx.noStroke();
      fx.fill(38, 75, 85, p.life * 0.8);
      fx.circle(p.x, p.y, 1.6 * s);
      continue;
    }

    if (p.kind === "crack") {             // 타닥 잔불꽃
      fx.noStroke();
      fx.fill(50, 10, 100, p.life);
      fx.circle(p.x, p.y, random(1, 3.5) * s);
      continue;
    }

    // star: 터진 불꽃 알갱이
    if (p.life < 0.3 && random() < 0.4) continue;     // 꺼지기 직전 깜빡임
    let sat = map(p.life, 1, 0.75, 0, p.sat, true);    // 처음엔 하얗게 뜨겁다가 색이 드러남
    fx.stroke(p.hue, sat, 100, p.life);
    fx.strokeWeight(p.size * s);
    fx.line(p.px, p.py, p.x, p.y);
    fx.noStroke();
    fx.fill(p.hue, sat, 100, 0.12 * p.life);           // 은은한 빛 번짐
    fx.circle(p.x, p.y, p.size * 5 * s);

    if (p.willow && frameCount % 2 === 0 && particles.length < MAX_PARTICLES) {
      particles.push({
        kind: "ash", x: p.x, y: p.y, px: p.x, py: p.y,
        vx: 0, vy: 0.2, drag: 0.98, grav: 0.01,
        life: 1, decay: 0.03
      });
    }
  }
}

function add(p) {
  if (particles.length < MAX_PARTICLES) {
    p.px = p.x;
    p.py = p.y;
    particles.push(p);
  }
}

// 손목에서 계속 튀는 스파클러(불꽃 막대) 불티
function sparkler(x, y) {
  for (let k = 0; k < SPARKLER_COUNT; k++) {
    let a = random(TWO_PI), sp = random(1, 4);
    add({
      kind: "spark", x: x, y: y,
      vx: cos(a) * sp, vy: sin(a) * sp,
      drag: 0.9, grav: 0.1,
      life: 1, decay: random(0.05, 0.09)
    });
  }
}

// 팡! 실제 불꽃놀이처럼 세 가지 모양 중 하나로 터짐
function burst(x, y, hue) {
  flash = 1;
  flashHue = hue;
  add({ kind: "flash", x: x, y: y, vx: 0, vy: 0, drag: 1, grav: 0, life: 1, decay: 0.15, hue: hue });

  let r = random();
  if (r < 0.55) {
    // 국화형(피오니): 구 모양으로 퍼지는 가장 흔한 불꽃 + 가운데 금빛 심
    let maxSp = random(4, 5.5);
    for (let k = 0; k < BURST_COUNT; k++) {
      let a = random(TWO_PI);
      let z = random(-1, 1);                      // 구를 정면에서 본 모양이 되도록
      let sp = maxSp * sqrt(1 - z * z) * random(0.92, 1);
      add({
        kind: "star", x: x, y: y,
        vx: cos(a) * sp, vy: sin(a) * sp,
        drag: 0.955, grav: 0.045,
        life: 1, decay: random(0.010, 0.016),
        hue: (hue + random(-8, 8) + 360) % 360, sat: 85, size: 2
      });
    }
    for (let k = 0; k < 20; k++) {
      let a = random(TWO_PI), sp = random(0.5, 2);
      add({
        kind: "star", x: x, y: y,
        vx: cos(a) * sp, vy: sin(a) * sp,
        drag: 0.95, grav: 0.03,
        life: 1, decay: random(0.02, 0.03),
        hue: 45, sat: 40, size: 1.8
      });
    }
  } else if (r < 0.8) {
    // 버들형(윌로우): 금빛 꼬리를 길게 늘어뜨리며 천천히 떨어짐
    let maxSp = random(3, 3.8);
    for (let k = 0; k < BURST_COUNT * 0.8; k++) {
      let a = random(TWO_PI);
      let z = random(-1, 1);
      let sp = maxSp * sqrt(1 - z * z);
      add({
        kind: "star", x: x, y: y,
        vx: cos(a) * sp, vy: sin(a) * sp,
        drag: 0.97, grav: 0.025,
        life: 1, decay: random(0.005, 0.008),
        hue: 38, sat: 75, size: 1.5, willow: true
      });
    }
  } else {
    // 고리형 + 타닥: 둥근 고리로 퍼지고 끝에서 잔불꽃이 터짐
    let n = floor(BURST_COUNT * 0.6);
    let sp = random(4, 5);
    for (let k = 0; k < n; k++) {
      let a = TWO_PI * k / n;
      add({
        kind: "star", x: x, y: y,
        vx: cos(a) * sp, vy: sin(a) * sp,
        drag: 0.955, grav: 0.035,
        life: 1, decay: random(0.014, 0.018),
        hue: hue, sat: 60, size: 2, crackle: true
      });
    }
  }
}

function crackle(x, y) {
  for (let k = 0; k < 3; k++) {
    add({
      kind: "crack",
      x: x + random(-6, 6) * s, y: y + random(-6, 6) * s,
      vx: 0, vy: 0, drag: 1, grav: 0.02,
      life: 1, decay: random(0.12, 0.2)
    });
  }
}

// =====================================================
//  배경: 한강 건너편에서 본 여의도 야경
// =====================================================
function makeLayers() {
  if (fx) fx.remove();
  if (sky) sky.remove();

  fx = createGraphics(width, height);
  fx.pixelDensity(1);
  fx.colorMode(HSB);
  fx.strokeCap(ROUND);

  sky = createGraphics(width, height);
  sky.pixelDensity(1);

  GROUND = height * 0.84;
  let W = width, H = GROUND;
  VPX = W * 0.56;          // 소실점: 화면 가운데 살짝 오른쪽
  VPY = GROUND - H * 0.12; // 눈높이: 수면보다 조금 위 → 낮은 건물은 지붕이 보임
  FOCAL = W * 0.6;      // 작을수록 입체감(원근)이 강해짐

  drawSky();
  sky.colorMode(HSB);

  // 먼 빌딩숲 → 안개로 흐리게
  row(H * 0.15, H * 0.32, 0.35, W * 0.025, W * 0.05);
  haze(0.55);

  // 중간 빌딩숲
  row(H * 0.18, H * 0.38, 0.6, W * 0.035, W * 0.065);
  haze(0.25);

  // 여의도 랜드마크 (소실점에서 먼 것부터 그림)
  building63(W * 0.12, W * 0.08, H * 0.6);
  assembly(W * 0.89, W * 0.17, H * 0.18);
  lgTwin(W * 0.27, W * 0.033, H * 0.34);
  withFacade(210, 25, () => wedgeTower(W * 0.78, W * 0.05, GROUND - H * 0.62, GROUND - H * 0.56, 1, W * 0.04));   // FKI타워
  withFacade(205, 30, () => wedgeTower(W * 0.35, W * 0.05, GROUND - H * 0.38, GROUND - H * 0.43, 1, W * 0.04));   // One IFC
  parc1Tower(W * 0.665, W * 0.055, H * 0.65);                                                                      // 파크원 2동
  withFacade(205, 30, () => wedgeTower(W * 0.42, W * 0.045, GROUND - H * 0.33, GROUND - H * 0.38, 1, W * 0.036)); // Two IFC
  withFacade(205, 30, () => wedgeTower(W * 0.48, W * 0.045, GROUND - H * 0.66, GROUND - H * 0.71, 1, W * 0.036)); // Three IFC
  parc1Tower(W * 0.575, W * 0.065, H * 0.8);                                                                       // 파크원 1동

  // 한강공원 나무숲
  treeLine();

  groundGlow();
  drawWaterBase();

  skyBlur = sky.get(0, 0, width, GROUND);   // 물에 비친 모습은 흐릿하게
  skyBlur.filter(BLUR, 3);
}

// 하늘: 맑은 밤하늘의 짙은 청색 → 지평선은 도시 불빛(나트륨등)에 물든 주황빛
//       + 별, 실제 같은 달, 도시 불빛을 아래에서 받은 구름
function drawSky() {
  sky.colorMode(RGB);
  colorMode(RGB);              // color()는 메인 캔버스 색 모드를 따르므로 잠시 RGB로
  sky.noStroke();
  let stops = [
    [0.0,  color(1, 3, 12)],
    [0.45, color(6, 12, 32)],
    [0.75, color(22, 30, 58)],
    [0.92, color(70, 55, 62)],
    [1.0,  color(120, 78, 52)]
  ];
  for (let y = 0; y < GROUND; y++) {
    let t = y / GROUND, c = stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        let a0 = stops[i - 1], a1 = stops[i];
        c = lerpColor(a0[1], a1[1], (t - a0[0]) / (a1[0] - a0[0]));
        break;
      }
    }
    sky.fill(c);
    sky.rect(0, y, width, 1);
  }

  // 별: 대부분 희미하고, 지평선 쪽은 도시 불빛에 묻혀 안 보임
  for (let i = 0; i < 160; i++) {
    let y = pow(random(), 1.6) * GROUND * 0.6;
    let fade = 1 - y / (GROUND * 0.6);
    let b = random() < 0.08 ? random(160, 230) : random(25, 110);
    let warm = random([[255, 255, 255], [255, 240, 220], [220, 230, 255]]);
    sky.fill(warm[0], warm[1], warm[2], b * fade);
    sky.circle(random(width), y, b > 150 ? 1.8 : random(0.6, 1.2));
  }

  colorMode(HSB);
  drawMoon(width * 0.85, GROUND * 0.17, max(18, height * 0.05));
  drawClouds();
}

// 달: NASA 루나 리커니선스 오비터(LRO)가 찍은 실제 달 표면 지도로 만든 보름달 이미지
//  출처: NASA/Goddard Space Flight Center Scientific Visualization Studio, CGI Moon Kit (공공 저작물)
function drawMoon(mx, my, mr) {
  let ctx = sky.drawingContext;
  let g = ctx.createRadialGradient(mx, my, mr * 0.95, mx, my, mr * 8);   // 달빛 번짐
  g.addColorStop(0, "rgba(210,220,240,0.30)");
  g.addColorStop(0.2, "rgba(170,185,220,0.10)");
  g.addColorStop(1, "rgba(120,140,190,0)");
  ctx.fillStyle = g;
  ctx.fillRect(mx - mr * 8, my - mr * 8, mr * 16, mr * 16);
  if (moonImg) sky.image(moonImg, mx - mr, my - mr, mr * 2, mr * 2);
}

// 구름: 노이즈로 만든 얇은 층운. 아래쪽은 도시 불빛을 받아 따뜻하게 물듦
function drawClouds() {
  let sc = 2;                                     // 절반 해상도로 계산 → 부드럽고 빠름
  let cw = ceil(width / sc), chh = ceil(GROUND * 0.8 / sc);
  let img = createImage(cw, chh);
  img.loadPixels();
  noiseDetail(5, 0.5);
  let seed = random(1000);
  for (let y = 0; y < chh; y++) {
    let t = y / chh;
    let band = sin(t * PI) * 0.9 + 0.1;           // 하늘 중간 높이에 구름이 많음
    let cr = lerp(28, 120, t * t), cg = lerp(32, 86, t * t), cb = lerp(52, 76, t * t);
    for (let x = 0; x < cw; x++) {
      let n = noise(seed + x * 0.006, y * 0.022);
      let dens = constrain((n - 0.5) / 0.22, 0, 1) * band;
      let idx = 4 * (y * cw + x);
      img.pixels[idx] = cr;
      img.pixels[idx + 1] = cg;
      img.pixels[idx + 2] = cb;
      img.pixels[idx + 3] = dens * 150;
    }
  }
  img.updatePixels();
  noiseDetail(4, 0.5);
  sky.image(img, 0, 0, width, chh * sc);
}

// 먼 건물일수록 지평선 쪽 공기색으로 덮어서 흐리게 (대기원근법)
function haze(a) {
  sky.noStroke();
  let span = GROUND * 0.6;
  for (let y = GROUND - span; y < GROUND; y += 3) {
    let t = (y - (GROUND - span)) / span;
    sky.fill(225, 25, 24, a * t);
    sky.rect(0, y, width, 3);
  }
}

// 지면 근처 가로등·거리 불빛이 은은하게 번지는 효과
function groundGlow() {
  sky.noStroke();
  let span = GROUND * 0.12;
  for (let y = GROUND - span; y < GROUND; y += 2) {
    let t = (y - (GROUND - span)) / span;
    sky.fill(30, 70, 60, 0.12 * t);
    sky.rect(0, y, width, 2);
  }
  for (let x = random(5, 20); x < width; x += random(8, 22)) {   // 호숫가 가로등
    sky.fill(38, 60, 100);
    sky.circle(x, GROUND - 2, 2);
    sky.fill(38, 60, 100, 0.15);
    sky.circle(x, GROUND - 2, 8);
  }
}

// 호수 바탕 (반사는 drawWater에서 매 프레임 그림)
function drawWaterBase() {
  sky.noStroke();
  for (let y = GROUND; y < height; y += 2) {
    let t = (y - GROUND) / (height - GROUND);
    sky.fill(230, 50, lerp(9, 2, t));
    sky.rect(0, y, width, 2);
  }
  sky.stroke(0, 0, 0);
  sky.strokeWeight(2);
  sky.line(0, GROUND, width, GROUND);
}

// ---------- 3D 원근 ----------
// 관객이 호수 건너편에서 도시를 바라보는 시점. 건물 옆면이 소실점(VPX, VPY)을 향해 좁아짐
let VPX, VPY, FOCAL;

function P(x, y, z) {                    // 깊이 z만큼 뒤에 있는 점을 화면 좌표로
  let f = 1 / (1 + z / FOCAL);
  return [VPX + (x - VPX) * f, VPY + (y - VPY) * f];
}

function winSize() { return max(2, width / 320); }

// 창문 불빛 색: 백열등, 형광등, LED, 호박색
const LIGHT_TONES = [[38, 55, 90], [55, 12, 92], [200, 12, 95], [30, 70, 80]];

// 층별 불 켜짐 패턴 (앞면과 옆면이 같은 층 패턴을 공유)
function genFloors(top, bottom) {
  let floorH = winSize() * 1.75, arr = [];
  for (let y = top + floorH * 0.8; y < bottom - floorH * 0.6; y += floorH) {
    let r = random();
    arr.push({ y: y, p: r < 0.06 ? 0.9 : r < 0.5 ? 0.04 : random(0.1, 0.4), tone: random(LIGHT_TONES) });
  }
  return arr;
}

// ---------- 사실적인 유리 외벽 칠하기 ----------
function hsbStr(h, sat, b, a = 1) {
  let c = color(h, sat, b);
  return `rgba(${round(red(c))},${round(green(c))},${round(blue(c))},${a})`;
}

function polyPath(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

// 앞면: 위쪽은 하늘이 비친 유리, 가운데는 어두운 유리, 아래는 거리 조명을 받은 따뜻한 빛
//       + 가로 방향 명암(한쪽 모서리가 더 어두움)
function glassFront(pts, x0, x1, top, bottom, dim, darkLeft) {
  let ctx = sky.drawingContext;
  let g = ctx.createLinearGradient(0, top, 0, bottom);
  g.addColorStop(0, hsbStr(FACADE[0], FACADE[1] * 0.8, 12 + 10 * dim));
  g.addColorStop(0.35, hsbStr(FACADE[0], FACADE[1], 6 + 6 * dim));
  g.addColorStop(0.85, hsbStr(FACADE[0], FACADE[1], 5 + 5 * dim));
  g.addColorStop(1, hsbStr(30, 50, 14 + 12 * dim));
  ctx.fillStyle = g;
  polyPath(ctx, pts);
  ctx.fill();
  let hgr = ctx.createLinearGradient(x0, 0, x1, 0);
  hgr.addColorStop(darkLeft ? 0 : 1, "rgba(0,0,0,0.35)");
  hgr.addColorStop(darkLeft ? 1 : 0, "rgba(0,0,0,0)");
  ctx.fillStyle = hgr;
  polyPath(ctx, pts);
  ctx.fill();
}

// 옆면: 앞면보다 어둡고, 위쪽만 살짝 하늘빛
function glassSide(pts, top, bottom, dim) {
  let ctx = sky.drawingContext;
  let g = ctx.createLinearGradient(0, top, 0, bottom);
  g.addColorStop(0, hsbStr(FACADE[0], FACADE[1] * 0.8, 7 + 6 * dim));
  g.addColorStop(0.4, hsbStr(FACADE[0], FACADE[1], 3 + 4 * dim));
  g.addColorStop(1, hsbStr(30, 40, 6 + 6 * dim));
  ctx.fillStyle = g;
  polyPath(ctx, pts);
  ctx.fill();
}

// 한 층의 창 띠: 사무실처럼 여러 칸이 이어져 켜지고, 칸 사이에 세로 창틀(멀리언)
function floorStrip(x0, x1, y, fl, dim) {
  let win = winSize(), colW = win * 1.3, hgt = win * 1.15;
  let xx = x0;
  sky.noStroke();
  while (xx < x1 - win * 0.5) {
    let xe = min(x1, xx + colW * (1 + floor(random(5))));
    if (random() < fl.p) {
      sky.fill(fl.tone[0], fl.tone[1], fl.tone[2] * (0.25 + 0.7 * dim) * random(0.7, 1));
      sky.rect(xx, y, xe - xx, hgt);
      sky.fill(fl.tone[0], fl.tone[1] * 0.5, 100, 0.12 * dim);       // 천장 조명이 더 밝은 윗부분
      sky.rect(xx, y, xe - xx, hgt * 0.3);
    }
    xx = xe;
  }
  sky.fill(FACADE[0], FACADE[1], 3 + 2 * dim, 0.8);                 // 창틀
  for (let m = x0; m < x1; m += colW) sky.rect(m, y, max(1, win * 0.2), hgt);
  sky.fill(FACADE[0], FACADE[1] * 0.5, 14 + 10 * dim, 0.5);         // 층 슬래브 선
  sky.rect(x0, y + hgt + win * 0.2, x1 - x0, 1);
}

// 옆면의 창 띠 (원근에 맞춰 사다리꼴로)
function sideStrip(xe, y, D, fl, dim) {
  let win = winSize(), colW = win * 1.3, hgt = win * 1.15;
  let z = win * 0.5;
  sky.noStroke();
  while (z < D - win * 0.5) {
    let ze = min(D - win * 0.3, z + colW * (1 + floor(random(4))));
    if (random() < fl.p) {
      sky.fill(fl.tone[0], fl.tone[1], fl.tone[2] * 0.6 * dim * random(0.6, 1));
      let a = P(xe, y, z), b = P(xe, y, ze), c = P(xe, y + hgt, ze), d = P(xe, y + hgt, z);
      sky.quad(a[0], a[1], b[0], b[1], c[0], c[1], d[0], d[1]);
    }
    z = ze;
  }
}

// 직육면체 건물 하나: 옆면 → (낮은 건물이면 지붕 윗면) → 앞면 순서로 그림
function prism(x, top, w, bottom, dim, D, floors) {
  floors = floors || genFloors(top, bottom);
  let edge = null;
  if (x + w < VPX) edge = x + w;          // 소실점 왼쪽 건물 → 오른쪽 옆면이 보임
  else if (x > VPX) edge = x;             // 소실점 오른쪽 건물 → 왼쪽 옆면이 보임
  if (edge !== null) sideFace(edge, top, bottom, D, dim, floors);
  if (top > VPY) topFace(x, top, w, D, dim);
  glassFront([[x, top], [x + w, top], [x + w, bottom], [x, bottom]], x, x + w, top, bottom, dim, edge === x);
  for (let fl of floors) floorStrip(x + winSize() * 0.6, x + w - winSize() * 0.6, fl.y, fl, dim);
  edgeLights(x, top, w, bottom, dim, edge);
}

// 모서리 하이라이트: 지붕선과, 옆면과 맞닿은 모서리
function edgeLights(x, top, w, bottom, dim, edge) {
  sky.noStroke();
  sky.fill(FACADE[0], FACADE[1] * 0.5, 20 + 15 * dim);
  sky.rect(x, top, w, 1);
  if (edge !== null) {
    sky.fill(FACADE[0], FACADE[1] * 0.4, 16 + 14 * dim, 0.8);
    sky.rect(edge === x ? x : x + w - 1, top, 1, bottom - top);
  }
}

function sideFace(xe, top, bottom, D, dim, floors) {
  let a = P(xe, top, D), b = P(xe, bottom, D);
  glassSide([[xe, top], [a[0], a[1]], [b[0], b[1]], [xe, bottom]], top, bottom, dim);
  if (dim < 0.5) return;                  // 먼 건물은 옆면 창 생략
  for (let fl of floors) sideStrip(xe, fl.y, D, fl, dim);
}

function topFace(x, top, w, D, dim) {
  let a = P(x, top, D), b = P(x + w, top, D);
  sky.noStroke();
  sky.fill(FACADE[0], FACADE[1] * 0.6, 8 + 6 * dim);
  sky.quad(x, top, x + w, top, b[0], b[1], a[0], a[1]);
}

// 한 줄로 늘어선 빌딩들 (바깥쪽부터 그려야 가운데 건물이 옆면을 자연스럽게 가림)
function row(minH, maxH, dim, minW, maxW) {
  let list = [];
  let x = -random(minW);
  while (x < width) {
    let w = random(minW, maxW);
    list.push({ x: x, w: w, h: random(minH, maxH) });
    x += w + random(w * 0.05, w * 0.4);
  }
  list.sort((a, b) => abs(b.x + b.w / 2 - VPX) - abs(a.x + a.w / 2 - VPX));
  for (let t of list) tower(t.x, t.w, t.h, dim);
}

function tower(x, w, h, dim) {
  prism(x, GROUND - h, w, GROUND, dim, w * 1.2);
  roof(x, GROUND - h, w, dim);
}

// 옥상 설비: 안테나 + 빨간 경고등, 기계실, 조명 띠
function roof(x, top, w, dim) {
  let r = random();
  sky.noStroke();
  if (r < 0.3) {
    let ah = random(10, 30) * (0.5 + dim * 0.5);
    sky.stroke(220, 10, 25 + 20 * dim);
    sky.strokeWeight(1.5);
    sky.line(x + w * 0.5, top, x + w * 0.5, top - ah);
    sky.noStroke();
    sky.fill(0, 90, 60 + 40 * dim);
    sky.circle(x + w * 0.5, top - ah, 3);
  } else if (r < 0.55) {
    sky.fill(225, 30, 6 + 5 * dim);
    sky.rect(x + w * 0.2, top - w * 0.12, w * 0.5, w * 0.12);
  } else if (r < 0.65) {
    sky.fill(45, 20, 60 + 35 * dim);
    sky.rect(x, top, w, 2);
  }
}

// =====================================================
//  여의도 랜드마크 (한강 북쪽에서 남쪽을 바라본 모습)
// =====================================================
let FACADE = [225, 30];     // 외벽 색 (색상, 채도) — 건물마다 바꿔 씀

function withFacade(h, sat, fn) { let old = FACADE; FACADE = [h, sat]; fn(); FACADE = old; }

// 위로 갈수록 폭이 달라지는 건물 (63빌딩처럼). hwAt(y) = 그 높이의 절반 폭
function shapedTower(cx, top, hwAt, D, dim, tones) {
  let bottom = GROUND;
  let hwB = hwAt(bottom);
  let edgeX = null, darkLeft = false;
  if (cx + hwB < VPX) edgeX = (y) => cx + hwAt(y);
  else if (cx - hwB > VPX) { edgeX = (y) => cx - hwAt(y); darkLeft = true; }

  if (edgeX) {                                   // 옆면
    let pts = [];
    for (let y = top; y <= bottom; y += 3) pts.push([edgeX(y), y]);
    for (let y = bottom; y >= top; y -= 3) pts.push(P(edgeX(y), y, D));
    glassSide(pts, top, bottom, dim);
  }
  let pts = [];                                  // 앞면
  for (let y = top; y <= bottom; y += 3) pts.push([cx - hwAt(y), y]);
  for (let y = bottom; y >= top; y -= 3) pts.push([cx + hwAt(y), y]);
  glassFront(pts, cx - hwB, cx + hwB, top, bottom, dim, darkLeft);
  for (let fl of genFloors(top, bottom)) {       // 창 띠
    if (tones) { fl.tone = random(tones); fl.p = max(fl.p, 0.6); }
    let hw = hwAt(fl.y) - winSize() * 0.6;
    floorStrip(cx - hw, cx + hw, fl.y, fl, dim);
  }
}

// 지붕이 비스듬히 잘린 건물 (IFC, FKI타워처럼). topL = 왼쪽 꼭대기, topR = 오른쪽 꼭대기
function wedgeTower(x, w, topL, topR, dim, D) {
  let floors = genFloors(min(topL, topR), GROUND);
  let edge = null;
  if (x + w < VPX) { edge = x + w; sideFace(x + w, topR, GROUND, D, dim, floors.filter(f => f.y > topR + 3)); }
  else if (x > VPX) { edge = x; sideFace(x, topL, GROUND, D, dim, floors.filter(f => f.y > topL + 3)); }
  glassFront([[x, topL], [x + w, topR], [x + w, GROUND], [x, GROUND]], x, x + w, min(topL, topR), GROUND, dim, edge === x);
  let win = winSize();
  for (let fl of floors) {
    // 비스듬한 지붕 아래쪽만 창을 그림
    let xa = x + win * 0.6, xb = x + w - win * 0.6;
    let need = fl.y - win;
    if (topR > topL) xb = min(xb, x + w * (need - topL) / (topR - topL));   // 오른쪽이 낮은 지붕
    if (topL > topR) xa = max(xa, x + w * (topL - need) / (topL - topR));   // 왼쪽이 낮은 지붕
    if (xb - xa > win) floorStrip(xa, xb, fl.y, fl, dim);
  }
  sky.stroke(200, 15, 55);                        // 비스듬한 지붕선의 조명
  sky.strokeWeight(1.5);
  sky.line(x, topL, x + w, topR);
  sky.noStroke();
  if (edge !== null) {
    sky.fill(FACADE[0], FACADE[1] * 0.4, 30, 0.8);
    sky.rect(edge === x ? x : x + w - 1, edge === x ? topL : topR, 1, GROUND - (edge === x ? topL : topR));
  }
}

// ---- 63빌딩: 위로 갈수록 좁아지는 금빛 유리 타워 ----
function building63(cx, w, h) {
  let top = GROUND - h;
  withFacade(40, 55, () => {
    prism(cx - w * 0.85, GROUND - h * 0.07, w * 1.7, GROUND, 1, w * 0.8);   // 아래쪽 저층부
    shapedTower(cx, top, (y) => (w / 2) * (0.42 + 0.58 * pow((y - top) / h, 0.85)), w * 0.55, 1,
                [[42, 65, 95], [38, 55, 90], [45, 40, 98]]);
  });
  sky.stroke(42, 60, 90);                         // 금빛 모서리 조명
  sky.strokeWeight(1.5);
  sky.noFill();
  sky.beginShape();
  for (let y = top; y <= GROUND - h * 0.07; y += 4) sky.vertex(cx - (w / 2) * (0.42 + 0.58 * pow((y - top) / h, 0.85)), y);
  sky.endShape();
  sky.beginShape();
  for (let y = top; y <= GROUND - h * 0.07; y += 4) sky.vertex(cx + (w / 2) * (0.42 + 0.58 * pow((y - top) / h, 0.85)), y);
  sky.endShape();
  sky.line(cx - w * 0.21, top, cx + w * 0.21, top);
  sky.noStroke();
  sky.fill(42, 30, 70);                           // 꼭대기 기계층
  sky.rect(cx - w * 0.14, top - h * 0.025, w * 0.28, h * 0.025);
  sky.fill(0, 90, 100);
  sky.circle(cx, top - h * 0.03, 3);
}

// ---- 파크원: 모서리의 붉은 거대 기둥이 지붕 위로 솟은 타워 ----
function parc1Tower(x, w, h) {
  let top = GROUND - h, ext = h * 0.05, fw = max(3, w * 0.075);
  withFacade(220, 25, () => prism(x, top, w, GROUND, 1, w * 0.8));
  sky.noStroke();
  for (let bx of [x - fw * 0.3, x + w - fw * 0.7]) {
    sky.fill(4, 75, 62);                          // 붉은 기둥 (밤엔 조명을 받아 선명)
    sky.rect(bx, top - ext, fw, h + ext);
    sky.fill(4, 70, 95, 0.5);
    sky.rect(bx + fw * 0.3, top - ext, fw * 0.25, h + ext);
  }
  for (let k = 1; k <= 3; k++) {                  // 기둥을 잇는 붉은 가로 보
    let yy = top + h * k * 0.25;
    sky.fill(4, 70, 45);
    sky.rect(x, yy, w, max(2, h * 0.006));
  }
  sky.fill(4, 80, 75);
  sky.rect(x - fw * 0.3, top - ext, w + fw * 0.6, max(2, fw * 0.4));
}

// ---- LG 트윈타워: 똑같은 두 동, 갈색빛 유리 ----
function lgTwin(cx, w, h) {
  withFacade(30, 45, () => {
    prism(cx - w * 1.3, GROUND - h, w, GROUND, 1, w * 0.9);
    prism(cx + w * 0.3, GROUND - h, w, GROUND, 1, w * 0.9);
  });
}

// ---- 국회의사당 ----
// 실제 건물 특징: 가로로 넓고 낮은 화강석 건물, 정면에 높고 가는 사각 기둥 8개가 지붕까지 이어짐,
// 두툼한 지붕 처마, 그 위 원통형 받침과 넓적한 청록색(산화 구리) 돔. 밤엔 아래에서 조명을 받아 하얗게 빛남
function assembly(cx, w, totalH) {
  let ctx = sky.drawingContext;
  let bodyH = totalH * 0.55, top = GROUND - bodyH;
  let x = cx - w / 2;
  let D = w * 0.55;                                  // 건물 깊이 (거의 정사각형 평면)

  // 앞 계단·기단
  sky.noStroke();
  sky.fill(40, 8, 55);
  sky.rect(x - w * 0.04, GROUND - bodyH * 0.08, w * 1.08, bodyH * 0.08);

  // 옆면 (소실점 오른쪽에 있으므로 왼쪽 옆면이 보임)
  let a = P(x, top, D), b = P(x, GROUND, D);
  let sg = ctx.createLinearGradient(0, top, 0, GROUND);
  sg.addColorStop(0, hsbStr(40, 8, 38));
  sg.addColorStop(1, hsbStr(40, 10, 55));
  ctx.fillStyle = sg;
  polyPath(ctx, [[x, top], a, b, [x, GROUND]]);
  ctx.fill();
  for (let k = 1; k <= 5; k++) {                     // 옆면 기둥
    let z0 = D * (k / 6) - D * 0.015, z1 = z0 + D * 0.03;
    let p1 = P(x, top + bodyH * 0.1, z0), p2 = P(x, top + bodyH * 0.1, z1);
    let p3 = P(x, GROUND - bodyH * 0.08, z1), p4 = P(x, GROUND - bodyH * 0.08, z0);
    sky.fill(40, 6, 70);
    sky.quad(p1[0], p1[1], p2[0], p2[1], p3[0], p3[1], p4[0], p4[1]);
  }

  // 정면 안쪽 벽 (기둥 뒤로 들어간 부분) + 층별 창
  let wg = ctx.createLinearGradient(0, top, 0, GROUND);
  wg.addColorStop(0, hsbStr(38, 15, 30));
  wg.addColorStop(1, hsbStr(38, 20, 45));
  ctx.fillStyle = wg;
  ctx.fillRect(x, top, w, bodyH);
  for (let f = 0; f < 6; f++) {                     // 기둥 사이 세로로 긴 창들
    let fy = top + bodyH * (0.18 + f * 0.12);
    for (let i = 0; i < 28; i++) {
      let wx = x + w * (0.02 + i * 0.035);
      sky.fill(42, 40, random() < 0.75 ? 85 : 35);
      sky.rect(wx, fy, w * 0.016, bodyH * 0.08);
    }
  }

  // 정면 기둥 8개: 아래에서 비추는 조명으로 아래가 더 밝음
  let n = 8, cw = w * 0.035;
  for (let i = 0; i < n; i++) {
    let px = x + w * 0.04 + (w * 0.92 - cw) * i / (n - 1);
    let cg = ctx.createLinearGradient(0, top, 0, GROUND);
    cg.addColorStop(0, hsbStr(40, 5, 72));
    cg.addColorStop(1, hsbStr(40, 8, 95));
    ctx.fillStyle = cg;
    ctx.fillRect(px, top + bodyH * 0.12, cw, bodyH * 0.8);
    sky.fill(40, 10, 45, 0.6);                       // 기둥 그늘진 쪽
    sky.rect(px + cw * 0.7, top + bodyH * 0.12, cw * 0.3, bodyH * 0.8);
  }

  // 두툼한 지붕 처마
  sky.fill(40, 6, 85);
  sky.rect(x - w * 0.01, top, w * 1.02, bodyH * 0.12);
  sky.fill(40, 10, 55);
  sky.rect(x - w * 0.01, top + bodyH * 0.1, w * 1.02, bodyH * 0.02);
  let ra = P(x - w * 0.01, top, D);                  // 처마 옆면
  sky.fill(40, 8, 60);
  sky.quad(x - w * 0.01, top, ra[0], ra[1], ra[0], ra[1] + bodyH * 0.1, x - w * 0.01, top + bodyH * 0.12);

  // 지붕 위 돔 받침 (2단)
  let dw = w * 0.56;
  let baseY = top;
  sky.fill(40, 8, 70);
  sky.rect(cx - dw * 0.62, baseY - totalH * 0.03, dw * 1.24, totalH * 0.03);
  let drumH = totalH * 0.06, drumY = baseY - totalH * 0.03 - drumH;
  let dg = ctx.createLinearGradient(0, drumY, 0, drumY + drumH);
  dg.addColorStop(0, hsbStr(40, 6, 60));
  dg.addColorStop(1, hsbStr(40, 8, 80));
  ctx.fillStyle = dg;
  ctx.fillRect(cx - dw * 0.52, drumY, dw * 1.04, drumH);
  for (let i = 0; i < 16; i++) {                     // 받침의 작은 창
    sky.fill(42, 40, 70);
    sky.rect(cx - dw * 0.48 + dw * 0.96 * i / 16, drumY + drumH * 0.3, dw * 0.025, drumH * 0.45);
  }

  // 청록색 돔: 넓적한 반구, 아래쪽이 조명을 받아 더 밝음
  let domeH = totalH - bodyH - totalH * 0.03 - drumH;
  let gy = ctx.createLinearGradient(0, drumY - domeH, 0, drumY);
  gy.addColorStop(0, hsbStr(165, 40, 30));
  gy.addColorStop(0.6, hsbStr(162, 38, 42));
  gy.addColorStop(1, hsbStr(158, 30, 60));
  ctx.fillStyle = gy;
  ctx.beginPath();
  ctx.ellipse(cx, drumY, dw / 2, domeH, 0, Math.PI, 2 * Math.PI);
  ctx.closePath();
  ctx.fill();
  let gx = ctx.createLinearGradient(cx - dw / 2, 0, cx + dw / 2, 0);   // 둥근 면의 좌우 음영
  gx.addColorStop(0, "rgba(0,0,0,0.35)");
  gx.addColorStop(0.45, "rgba(255,255,255,0.06)");
  gx.addColorStop(1, "rgba(0,0,0,0.25)");
  ctx.fillStyle = gx;
  ctx.beginPath();
  ctx.ellipse(cx, drumY, dw / 2, domeH, 0, Math.PI, 2 * Math.PI);
  ctx.closePath();
  ctx.fill();
  sky.fill(40, 8, 75);                               // 꼭대기 작은 장식
  sky.rect(cx - dw * 0.03, drumY - domeH - totalH * 0.012, dw * 0.06, totalH * 0.012);
}

// 호숫가 한강공원 나무숲 (어두운 실루엣)
function treeLine() {
  sky.noStroke();
  sky.fill(150, 30, 4);
  sky.beginShape();
  sky.vertex(0, GROUND);
  for (let x = 0; x <= width; x += 4) sky.vertex(x, GROUND - GROUND * (0.008 + 0.014 * noise(x * 0.03, 99)));
  sky.vertex(width, GROUND);
  sky.endShape(CLOSE);
}

// =====================================================
//  호수: 띠 단위로 잘라 물결처럼 흔들며 뒤집어 비춤
// =====================================================
function drawWater() {
  let r = height - GROUND;
  let t = frameCount * 0.05;
  let sh = 3;
  for (let k = 0; k < r; k += sh) {
    let depth = k / r;
    let off = sin(k * 0.35 + t) * (1 + depth * 6) + sin(k * 0.11 - t * 0.7) * depth * 4;
    let srcY = GROUND - k * 0.6 - sh;      // 0.6: 반사가 세로로 길게 늘어나 보이게
    if (srcY < 0) break;

    blendMode(BLEND);                       // 도시 반사
    tint(0, 0, 100, 0.6 * (1 - depth * 0.5));
    image(skyBlur, off * 1.5, GROUND + k, width, sh, 0, srcY, width, sh);

    blendMode(ADD);                         // 불꽃 반사
    tint(0, 0, 100, 0.65 * (1 - depth * 0.4));
    image(fx, off * 1.5, GROUND + k, width, sh, 0, srcY, width, sh);
  }
  noTint();
  blendMode(BLEND);
}

// =====================================================

function updateCamSize() {
  let vw = video.elt.videoWidth;
  let vh = video.elt.videoHeight;
  if (vw > 0 && vh > 0 && (vw !== camW || vh !== camH)) {
    camW = vw;
    camH = vh;
    computeScale();
    console.log("카메라 크기: " + camW + " x " + camH);
  }
}

function handle(point, key, hue) {
  if (!point || point.confidence < MIN_CONF) {
    delete prevPts[key];
    return;
  }

  let x = offX + (camW - point.x) * s;
  let y = offY + point.y * s - Y_UP;

  sparkler(x, y);

  let prev = prevPts[key];
  if (prev) {
    let speed = dist(point.x, point.y, prev.x, prev.y);
    let now = millis();
    if (speed > SPEED_MIN && now - (lastPop[key] || 0) > COOLDOWN) {
      lastPop[key] = now;
      burst(x, y, hue);

      let idx = floor(map(point.y, camH, 0, 0, SCALE.length));
      idx = constrain(idx, 0, SCALE.length - 1);
      playChime(SCALE[idx]);
    }
  }
  prevPts[key] = { x: point.x, y: point.y };
}

function playChime(freq) {
  if (!audioCtx) return;
  let t = audioCtx.currentTime;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(VOLUME, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.8);
}

function computeScale() {
  s = max(width / camW, height / camH);
  offX = (width - camW * s) / 2;
  offY = (height - camH * s) / 2;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeLayers();
  computeScale();
}

function keyPressed() {
  if (key === "d" || key === "D") debugView = !debugView;
}

function mousePressed() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();

  let el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }
}

function gotPoses(results) {
  poses = results;
}
