<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>손끝 불꽃놀이</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
let bodyPose;
let video;
let poses = [];
let particles = [];

const MIN_CONF = 0.2;
let camW = 640, camH = 480;
let s = 1, offX = 0, offY = 0;

// ===== 위치 보정 =====
const Y_UP = 180;      // 불꽃을 위로 올리는 정도 (화면 픽셀). 더 올리려면 숫자를 키우기
let debugView = false; // D 키로 켜고 끄는 확인 모드

// ===== 불꽃 설정 =====
const BURST_COUNT = 30;
const EMBER_EVERY = 2;
const MAX_PARTICLES = 800;

// ===== 소리 설정 =====
let audioCtx = null;
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
const SPEED_MIN = 6;
const COOLDOWN = 80;
const VOLUME = 0.15;
let prevPts = {};
let lastPop = {};

function preload() {
  ml5.setBackend("webgl");
  bodyPose = ml5.bodyPose();
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  video = createCapture(VIDEO);
  video.hide();
  colorMode(HSB);
  strokeCap(ROUND);
  noCursor();
  computeScale();

  console.log("모델 준비 완료!");
  bodyPose.detectStart(video, gotPoses);
}

function draw() {
  updateCamSize();

  blendMode(BLEND);
  background(0, 0, 0, 0.12);

  // 확인 모드: 카메라 영상을 희미하게 겹쳐서 보여줌
  if (debugView) {
    push();
    translate(offX + camW * s, offY - Y_UP);
    scale(-s, s);                 // 좌우 반전
    tint(0, 0, 100, 0.25);        // 희미하게
    image(video, 0, 0, camW, camH);
    pop();
    noTint();
  }

  blendMode(ADD);

  for (let i = 0; i < poses.length; i++) {
    let pose = poses[i];
    let baseHue = (i * 120) % 360;
    handle(pose.left_wrist,  i + "L", baseHue);
    handle(pose.right_wrist, i + "R", baseHue);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.px = p.x;
    p.py = p.y;
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.vy += p.grav;
    p.x += p.vx * s;
    p.y += p.vy * s;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    if (p.kind === "flash") {
      noStroke();
      fill(p.hue, 20, 100, p.life);
      circle(p.x, p.y, 60 * s * p.life);
      continue;
    }

    if (p.life < 0.4 && random() < 0.35) continue;

    let sat = map(p.life, 1, 0.5, 5, 85, true);
    stroke(p.hue, sat, 100, p.life);
    strokeWeight((p.kind === "spark" ? 2.5 : 2) * s);
    line(p.px, p.py, p.x, p.y);
  }
}

function updateCamSize() {
  let vw = video.elt.videoWidth;
  let vh = video.elt.videoHeight;
  if (vw > 0 && vh > 0 && (vw !== camW || vh !== camH)) {
    camW = vw;
    camH = vh;
    computeScale();
    console.log("카메라 크기: " + camW + " x " + camH);
  }
}

function handle(point, key, baseHue) {
  if (!point || point.confidence < MIN_CONF) {
    delete prevPts[key];
    return;
  }

  let x = offX + (camW - point.x) * s;
  let y = offY + point.y * s - Y_UP;   // ← 여기서 위로 올림

  if (frameCount % EMBER_EVERY === 0) ember(x, y, baseHue);

  let prev = prevPts[key];
  if (prev) {
    let speed = dist(point.x, point.y, prev.x, prev.y);
    let now = millis();
    if (speed > SPEED_MIN && now - (lastPop[key] || 0) > COOLDOWN) {
      lastPop[key] = now;
      burst(x, y, baseHue);

      let idx = floor(map(point.y, camH, 0, 0, SCALE.length));
      idx = constrain(idx, 0, SCALE.length - 1);
      playChime(SCALE[idx]);
    }
  }
  prevPts[key] = { x: point.x, y: point.y };
}

function ember(x, y, baseHue) {
  if (particles.length > MAX_PARTICLES) return;
  particles.push({
    kind: "ember",
    x: x, y: y, px: x, py: y,
    vx: random(-0.5, 0.5),
    vy: random(-1.5, -0.3),
    drag: 0.99,
    grav: -0.005,
    life: 1,
    decay: 0.015,
    hue: (baseHue + random(-20, 20) + 360) % 360
  });
}

function burst(x, y, baseHue) {
  particles.push({
    kind: "flash",
    x: x, y: y, px: x, py: y,
    vx: 0, vy: 0, drag: 1, grav: 0,
    life: 1, decay: 0.12,
    hue: baseHue
  });

  for (let k = 0; k < BURST_COUNT; k++) {
    if (particles.length > MAX_PARTICLES) return;
    let angle = TWO_PI * k / BURST_COUNT + random(-0.1, 0.1);
    let speed = random(2.5, 4.5);
    particles.push({
      kind: "spark",
      x: x, y: y, px: x, py: y,
      vx: cos(angle) * speed,
      vy: sin(angle) * speed,
      drag: 0.95,
      grav: 0.04,
      life: 1,
      decay: random(0.012, 0.02),
      hue: (baseHue + random(-15, 15) + 360) % 360
    });
  }
}

function playChime(freq) {
  if (!audioCtx) return;
  let t = audioCtx.currentTime;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(VOLUME, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.8);
}

function computeScale() {
  s = max(width / camW, height / camH);
  offX = (width - camW * s) / 2;
  offY = (height - camH * s) / 2;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  computeScale();
}

// D 키: 확인 모드 켜기/끄기
function keyPressed() {
  if (key === "d" || key === "D") debugView = !debugView;
}

function mousePressed() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();

  let el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }
}

function gotPoses(results) {
  poses = results;
}
</script>
</body>
</html>
